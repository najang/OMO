name: CI - Flutter

on:
  push:
    branches: [ main ]
    paths:
      - 'omo_app/**'
      - '.github/workflows/ci-flutter.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'omo_app/**'
      - '.github/workflows/ci-flutter.yml'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: omo_app
        run: flutter pub get

      - name: Analyze
        working-directory: omo_app
        run: flutter analyze

      # 테스트 코드 생기면 아래 주석 해제
      # - name: Test
      #   working-directory: omo_app
      #   run: flutter test